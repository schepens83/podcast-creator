[project]
name = "podcast-creator"
version = "0.3.0"
description = "EPUB/PDF/markdown -> spoken monologue -> mp3 -> schepens.cc/podcast."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "requests>=2.31.0",
]

[project.scripts]
tts = "tts:main"
podcastify = "podcastify:main"
publish-to-schepens = "publish_to_schepens:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tts.py", "podcastify.py", "publish_to_schepens.py", "pcommon.py", "skills"]
